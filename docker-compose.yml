services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: oci-site-portifolio:latest
    container_name: oci-site-portifolio
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
