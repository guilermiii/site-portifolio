name: CI/CD Pipeline & Docker Hub Multi-Arch Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Lint, Build & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript & Build Bundle
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test

  docker:
    name: Build & Publish to Docker Hub
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Docker Hub Credentials & Image Name
        id: docker_prep
        run: |
          RAW_USER="${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'devguina' }}"
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          if [ -z "$CLEAN_USER" ]; then
            CLEAN_USER="devguina"
          fi
          echo "username=${CLEAN_USER}" >> "$GITHUB_OUTPUT"
          echo "image=${CLEAN_USER}/site-portifolio" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.docker_prep.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.docker_prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
